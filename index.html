<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#121826"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>PCs Gamer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column app shell — sticky header, content column (max 760px), fixed bottom tab bar.
   Cards only for PCs, part rows and sheets; everything else sits on the page ground. */
:root{
  --bg:#ECEFF5; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#D9E0EB; --line-2:#C7D0DE;
  --ink:#121826; --ink-2:#465166; --ink-3:#768196;
  --accent:#2A55E5; --accent-ink:#FFFFFF; --accent-soft:#E2E9FD;
  --good:#127A4B; --good-soft:#DCF2E6; --warn:#9A5800; --warn-soft:#FCEFD6;
  --crit:#BE2F38; --crit-soft:#FBE2E3; --info:#3D5888; --info-soft:#E5EBF5;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 6px 20px rgba(18,24,38,.07);
  --scrim:rgba(14,18,26,.42);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1118; --surface:#151B25; --surface-2:#1B2230; --line:#283143; --line-2:#364056;
    --ink:#E7EBF3; --ink-2:#A8B1C3; --ink-3:#7A8498;
    --accent:#7F9CFF; --accent-ink:#0A1020; --accent-soft:#1D2848;
    --good:#4FC88B; --good-soft:#12301F; --warn:#EFB24C; --warn-soft:#33260D;
    --crit:#FF7C83; --crit-soft:#3A191C; --info:#9EB4DF; --info-soft:#1B2437;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1118; --surface:#151B25; --surface-2:#1B2230; --line:#283143; --line-2:#364056;
  --ink:#E7EBF3; --ink-2:#A8B1C3; --ink-3:#7A8498;
  --accent:#7F9CFF; --accent-ink:#0A1020; --accent-soft:#1D2848;
  --good:#4FC88B; --good-soft:#12301F; --warn:#EFB24C; --warn-soft:#33260D;
  --crit:#FF7C83; --crit-soft:#3A191C; --info:#9EB4DF; --info-soft:#1B2437;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
/* The app's own theme switch (Ajustes) wins over the system/viewer theme. */
:root[data-app-theme="light"]{
  --bg:#ECEFF5; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#D9E0EB; --line-2:#C7D0DE;
  --ink:#121826; --ink-2:#465166; --ink-3:#768196;
  --accent:#2A55E5; --accent-ink:#FFFFFF; --accent-soft:#E2E9FD;
  --good:#127A4B; --good-soft:#DCF2E6; --warn:#9A5800; --warn-soft:#FCEFD6;
  --crit:#BE2F38; --crit-soft:#FBE2E3; --info:#3D5888; --info-soft:#E5EBF5;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 6px 20px rgba(18,24,38,.07); --scrim:rgba(14,18,26,.42);
  color-scheme:light;
}
:root[data-app-theme="dark"]{
  --bg:#0D1118; --surface:#151B25; --surface-2:#1B2230; --line:#283143; --line-2:#364056;
  --ink:#E7EBF3; --ink-2:#A8B1C3; --ink-3:#7A8498;
  --accent:#7F9CFF; --accent-ink:#0A1020; --accent-soft:#1D2848;
  --good:#4FC88B; --good-soft:#12301F; --warn:#EFB24C; --warn-soft:#33260D;
  --crit:#FF7C83; --crit-soft:#3A191C; --info:#9EB4DF; --info-soft:#1B2437;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.mono{font-family:var(--f-mono)}
.good{color:var(--good)} .bad{color:var(--crit)} .warnc{color:var(--warn)}
h1,h2,h3{margin:0;text-wrap:balance}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;line-height:1}
.brand .sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)} .dot.err{background:var(--crit)}
.icon-btn{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.icon-btn:active{transform:scale(.97)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn.add svg{width:22px;height:22px;stroke-width:2.4}
.top-actions{display:flex;gap:8px;flex:none}

main{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11.5px;font-weight:600;color:var(--ink-3);min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* Sections */
.sec{margin-top:20px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 0;min-height:40px}
.sec-h h2{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.01em;flex:1;min-width:0}
.sec-h .count{font-size:12px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chev{width:20px;height:20px;color:var(--ink-3);transition:transform .2s;flex:none}
[aria-expanded="false"] > .chev{transform:rotate(-90deg)}
.link-btn[aria-expanded="true"] > .chev{transform:none}
.sec-b{margin-top:8px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel + .panel{margin-top:10px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);margin-bottom:14px}
.banner > svg{width:22px;height:22px;flex:none;color:var(--warn);margin-top:1px}
.banner b{display:block}
.banner .btn{margin-top:8px}

/* Pipeline strip */
.pipe{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:4px}
.stage{display:flex;flex-direction:column;justify-content:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 9px;text-align:left;min-width:0}
.stage .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.stage .t{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:4px;line-height:1.25}
.stage.s-estoque .n{color:var(--accent)} .stage.s-vendido .n{color:var(--good)}
.pipe .arr{display:grid;place-items:center;color:var(--ink-3)}
.money-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.figure{display:flex;flex-direction:column;justify-content:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.figure .v{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.figure .s{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.bars-h{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.bars-h span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.row:first-child{border-top:0}
button.row:active,.row.tap:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .title{display:block;font-weight:600;overflow-wrap:anywhere}
.row .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.row .end{text-align:right;flex:none;padding-top:1px}
.row-ic{flex:none;width:18px;margin-top:1px}
.row-ic svg{width:18px;height:18px}
.row .end .v{font-weight:700}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* Filtros em segmentos (contagem + rótulo) */
.fseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:3px;width:100%}
.fseg button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 7px;border-radius:10px;min-width:0;color:var(--ink-2)}
.fseg .n{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.fseg .t{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fseg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.link-btn{display:inline-flex;align-items:center;gap:7px;min-height:42px;margin-top:6px;font-weight:700;font-size:14px;color:var(--accent)}
.link-btn > svg{width:18px;height:18px}
.link-btn .chev{width:18px;height:18px;color:var(--accent)}
.link-btn[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.pc-actions{display:flex;flex-direction:column;gap:8px}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns3 .btn{padding:0 6px;font-size:13.5px;gap:5px;min-width:0}
.btns3 .btn svg{width:16px;height:16px;flex:none}
.ad-btns{display:flex;flex-direction:column;gap:8px}

/* Pills, chips, tags */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;line-height:1.2}
.s-montagem.pill{background:var(--info-soft);color:var(--info)}
.s-estoque.pill{background:var(--accent-soft);color:var(--accent)}
.s-vendido.pill{background:var(--good-soft);color:var(--good)}
.pill.caminho{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.tag{font-family:var(--f-mono);font-weight:600;font-size:12px;padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .chips{flex:1;min-width:0}
.toolbar .fseg{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;font-size:14.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,var(--line))}
.btn.danger.solid{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form{display:flex;flex-direction:column;gap:14px}
input[type="text"],input[type="date"],input[type="search"],select,textarea{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);padding:10px 12px;font-size:16px;color:var(--ink);min-width:0}
textarea{min-height:88px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.money-in{position:relative}
.money-in::before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:var(--ink-3);pointer-events:none}
.money-in input{padding-left:38px}
.pct-in{position:relative}
.pct-in::after{content:"%";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink-3);pointer-events:none}
.unit-in{position:relative}
.unit-in input{padding-right:40px}
.unit-in em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:700;color:var(--ink-3);pointer-events:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{min-height:38px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink-2);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.status button[aria-pressed="true"].s-montagem{color:var(--info)}
.seg.status button[aria-pressed="true"].s-estoque{color:var(--accent)}
.seg.status button[aria-pressed="true"].s-vendido{color:var(--good)}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hint{font-size:12.5px;color:var(--ink-3)}
.detect{font-size:12.5px;color:var(--info);background:var(--info-soft);border-radius:8px;padding:6px 10px}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.sugg button{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.sugg button:first-child{border-top:0}
.sugg button span:last-child{color:var(--ink-3);white-space:nowrap;font-size:12.5px}

/* PC cards */
.pcs{display:flex;flex-direction:column;gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:80px}
.pc.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.pc-head{display:block;width:100%;text-align:left;padding:14px}
.pc-head .l1{display:flex;align-items:center;gap:8px}
.pc-head .name{font-family:var(--f-display);font-weight:600;font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.pc-head .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.nums div{min-width:0}
.nums .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.nums .v{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-body{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:18px}
.block-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.slots{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-top:1px solid var(--line);min-height:54px;background:var(--surface)}
.slot:first-child{border-top:0}
.slot:active{background:var(--surface-2)}
.slot .c{flex:1;min-width:0}
.slot .cat,.slot .nm,.slot .sp{display:block}
.slot .cat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.slot .nm{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.slot .nm.empty-slot{color:var(--accent);font-weight:600}
.slot .nm.empty-slot.optional{color:var(--ink-3);font-weight:500}
.slot .sp{font-size:12px;color:var(--ink-3)}
.slot .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.slot .r .v{font-weight:700;font-size:14px}
.slot-total{display:flex;justify-content:space-between;padding:10px 12px;background:var(--surface-2);border-top:1px solid var(--line);font-weight:700}
.missing{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12.5px}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:9px;font-size:13.5px;line-height:1.35}
.alert svg{width:16px;height:16px;flex:none;margin-top:1px}
.alert.crit{background:var(--crit-soft);color:var(--crit)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert span{color:var(--ink)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.calc .k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.calc .v{font-weight:700}

// Guarda o preço visto (menor do dia) para o produto. Devolve true se mudou algo.

// Recebe o texto de uma promoção e, se for bom preço, guarda na lista de Ofertas.
// Devolve o registro criado (ou null). Repetições do mesmo produto e preço em 12 h são ignoradas.
function ingestOffer(text, channel) {

const findBuild = id => S.builds.find(b => b.id === id);

function slotPart(b, cat) {

    if (!it) return null;

    const rec = Math.ceil(min * 1.25 / 50) * 50;
    const gname = gpuP && !gpuP.igpu ? gpuP.label : 'placa de vídeo';
    if (psuW < min) A.push({ lvl: 'crit', tag: 'psu', msg: `Fonte de ${psuW} W abaixo do mínimo estimado de ${min} W para a ${gname}.` });
    else if (psuW < rec) A.push({ lvl: 'warn', msg: `Fonte de ${psuW} W no limite para a ${gname}. Recomendado a partir de ${rec} W.` });
  }

  // Armazenamento
  if (p.nvme || p.sata) {
    const unknown = (p.nvme && !p.nvme.specs?.gb) || (p.sata && !p.sata.specs?.gb);
    const tot = storageGB(p);
    if (unknown && !tot) A.push({ lvl: 'info', msg: 'Informe a capacidade do armazenamento.' });
    else if (tot && tot < 480) A.push({ lvl: 'warn', msg: `Armazenamento total de ${gbLabel(tot)}: abaixo de 480 GB.` });
  }

  // Equilíbrio
  if (cpu && gpuP && !gpuP.igpu) {
    if (gpuP.tier - cpu.score >= 2) A.push({ lvl: 'warn', msg: `Possível gargalo: o ${cpu.short} deve limitar a ${gpuP.label}.` });
    const pcie = Math.min(cpu.pcie, board ? board.pcie : 9);
    if (pcie <= 3 && gpuP.lanes === 4) A.push({ lvl: 'warn', msg: `A ${gpuP.label} usa só 4 linhas PCIe e perde desempenho nesta plataforma PCIe 3.0.` });
    else if (cpu.apuZenPlus && gpuP.lanes === 8 && gpuP.tier >= 3) A.push({ lvl: 'info', msg: `O ${cpu.short} libera só PCIe 3.0 x8 para a placa de vídeo, o que tira um pouco do desempenho da ${gpuP.label}.` });
  }

  // Comercial
  const onWay = Object.values(p).filter(x => x.mode === 'inv' && x.status === 'caminho').length;
  if (onWay) A.push({ lvl: b.status === 'estoque' ? 'warn' : 'info', msg: `${plural(onWay, 'peça ainda está', 'peças ainda estão')} a caminho.` });
  if (!(b.price > 0)) A.push({ lvl: 'info', msg: 'Defina o preço pretendido.' });
  else if (f.profit < 0) A.push({ lvl: 'crit', msg: `Preço pretendido abaixo do custo (${money(f.cost)}).` });
  else if (f.margin < 10) A.push({ lvl: 'warn', msg: `Margem de ${pct(f.margin)}: abaixo de 10%.` });
  if (b.status === 'estoque') {
    const d = daysSince(b.readyAt);
    if (d != null && d >= (S.settings.staleDays || 30)) A.push({ lvl: 'warn', msg: `Parado em estoque há ${d} dias.` });
  }
  const order = { crit: 0, warn: 1, info: 2 };
  return A.sort((a, b) => order[a.lvl] - order[b.lvl]);
}

/* Perfil e anúncio */
function profileFor(b) {
  const p = parts(b);
  const cpu = p.cpu ? parseCPU(p.cpu.name) : null;
  let tier;
  if (p.gpu) {
    const g = parseGPU(p.gpu.name);
    if (!g) return null;
    tier = g.tier;
  } else if (cpu && cpu.igpu) {
    tier = cpu.brand === 'AMD' && cpu.series === 8 && /g/i.test(cpu.short) ? 1 : 0;
  } else return null;
  if (cpu && tier - cpu.score >= 2) tier = cpu.score + 1;
  return Math.max(0, Math.min(5, tier));
}
function adCfg(b) {
  const d = S.settings.ad, o = b.ad || {};
  return {
    title: o.title || '',
    cond: o.cond ?? d.cond, os: o.os ?? d.os, terms: o.terms ?? d.terms, notes: o.notes ?? d.notes,
  };
}
function autoTitle(b) {
  const p = parts(b);
  const bits = ['PC Gamer'];
  const cpu = p.cpu ? parseCPU(p.cpu.name) : null;
  const g = p.gpu ? parseGPU(p.gpu.name) : null;
  const head = s => String(s || '').split(/\s+\+\s+/)[0].trim();
  const cpuS = cpu ? cpu.short : head(p.cpu?.name);
  const gpuS = p.gpu ? (g ? g.label : head(p.gpu.name)) : (cpu?.igpu ? 'Vídeo integrado' : '');
  const main = [cpuS, gpuS].filter(Boolean).join(' + ');
  if (main) bits.push(main);
  if (p.ram?.specs?.gb) bits.push(`${p.ram.specs.gb}GB`);
  const disk = Math.max(p.nvme?.specs?.gb || 0, p.sata?.specs?.gb || 0);
  if (disk) bits.push(`SSD ${gbLabel(disk).replace(' ', '')}`);
  return bits.join(' ');
}
function adCheck(b) {
  const p = parts(b);
  const cpu = p.cpu ? parseCPU(p.cpu.name) : null;
  const need = [];
  if (!p.cpu) need.push('Processador');
  if (!p.gpu && !(cpu && cpu.igpu)) need.push('Placa de vídeo');
  if (!p.mobo) need.push('Placa-mãe');
  if (!p.ram) need.push('Memória RAM');
  if (!p.nvme && !p.sata) need.push('Armazenamento');
  if (!p.psu) need.push('Fonte');
  if (!p.case) need.push('Gabinete');
  const blocks = alertsFor(b).filter(a => a.lvl === 'crit' && a.tag);
  return { need, blocks };
}
function adText(b) {
  const p = parts(b);
  const cfg = adCfg(b);
  const cpu = p.cpu ? parseCPU(p.cpu.name) : null;
  const tier = profileFor(b);
  const L = [];
  L.push((cfg.title || autoTitle(b)).toUpperCase());
  L.push('');
  if (tier != null) { L.push(`Perfil: ${PROFILES[tier].name}`); L.push(PROFILES[tier].text); L.push(''); }
  L.push('CONFIGURAÇÃO');
  const line = (lab, cat) => { if (p[cat]) L.push(`• ${lab}: ${p[cat].name}`); };
  line('Processador', 'cpu');
  line('Cooler', 'cooler');
  if (p.gpu) L.push(`• Placa de vídeo: ${p.gpu.name}`);
  else if (cpu?.igpu) L.push('• Vídeo: integrado ao processador');
  line('Placa-mãe', 'mobo');
  if (p.ram) {
    const rs = p.ram.specs || {};
    const nm = p.ram.name;
    const extra = rs.sticks > 1 && !/\dx\d/i.test(nm.replace(/\s/g, '')) ? ` (${rs.sticks}x${+(rs.gb / rs.sticks).toFixed(1)} GB)` : '';
    L.push(`• Memória RAM: ${nm}${extra}`);
  }
  line('SSD NVMe', 'nvme');
  line(p.sata && /hd|hdd/i.test(p.sata.name) && !/ssd/i.test(p.sata.name) ? 'HD' : 'SSD', 'sata');
  line('Fonte', 'psu');
  line('Gabinete', 'case');
  line('Ventilação', 'fans');
  L.push('');
  if (cfg.cond.trim()) L.push(cfg.cond.trim());
  if (cfg.os.trim()) L.push(cfg.os.trim());
  const terms = cfg.terms.split('\n').map(t => t.trim()).filter(Boolean);
  if (terms.length) { L.push(''); L.push('CONDIÇÕES'); terms.forEach(t => L.push(`• ${t}`)); }
  if (cfg.notes.trim()) { L.push(''); L.push(cfg.notes.trim()); }
  return L.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* Histórico e busca de preços */
const STOP = new Set('de da do das dos e com para placa video memoria ram ssd hd hdd gb tb mhz fonte w gabinete processador cooler kit nvme sata m 2 the and'.split(' '));
const SUFFIX = new Set(['ti', 'xt', 'xtx', 'super', 'x', 'g', 'f', 'k', 'kf', 'gt', 'ks', 'gre']);
function matchName(query, name) {
  const qt = toks(query), nt = toks(name);
  if (!qt.length) return true;
  const qn = qt.join(' '), nn = nt.join(' ');
  let sig = qt.filter(t => !STOP.has(t));
  if (!sig.length) sig = qt;
  if (!(nn.includes(qn) || sig.every(t => nt.includes(t)))) return false;
  // "6600" não deve casar com "6600 XT", nem "5600" com "5600X"
  for (let i = 0; i < qt.length; i++) {
    if (!/^\d{3,5}$/.test(qt[i])) continue;
    const j = nt.indexOf(qt[i]);
    if (j < 0) continue;
    const nNext = nt[j + 1], qNext = qt[i + 1];
    if (nNext && SUFFIX.has(nNext) && nNext !== qNext) return false;
  }
  return true;
}
function histFind(cat, text) {
  return S.hist.filter(h => (!cat || h.cat === cat) && matchName(text, h.name))
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.u || 0) - (a.u || 0));
}
function nameSuggestions(cat, text, limit = 6) {
  const qt = toks(text);
  if (!qt.length) return [];
  const pool = new Map();
  const add = (n, cost, date, specs, c) => {
    if (!n || (cat && c !== cat)) return;
    const k = norm(n);
    const cur = pool.get(k);
    if (!cur || (date || '') > (cur.date || '')) pool.set(k, { name: n, cost, date, specs, cat: c });
  };
  S.hist.forEach(h => add(h.name, h.cost, h.date, h.specs, h.cat));
  S.inv.forEach(i => add(i.name, i.cost, i.date, i.specs, i.cat));
  const out = [];
  for (const v of pool.values()) {
    const nt = toks(v.name);
    if (qt.every(q => nt.some(t => t.startsWith(q)))) out.push(v);
  }
  const typed = norm(text);
  return out.filter(v => norm(v.name) !== typed).sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, limit);
}

/* Capital, mensal */
function capital() {
  let free = 0, inPCs = 0, onWay = 0, planned = 0;
  S.inv.forEach(i => { if (i.status === 'caminho') onWay += i.cost; else if (i.buildId) inPCs += i.cost; else free += i.cost; });
  S.builds.forEach(b => { if (b.status !== 'vendido') CATS.forEach(c => { const sl = b.slots[c.k]; if (sl && sl.mode === 'plan') planned += sl.cost || 0; }); });
  return { free: round2(free), inPCs: round2(inPCs), onWay: round2(onWay), total: round2(free + inPCs + onWay), planned: round2(planned) };
}
function realizedEvents() {
  const ev = [];
  S.builds.filter(b => b.status === 'vendido').forEach(b => { const f = fin(b); if (f.price > 0) ev.push({ kind: 'pc', date: b.sale.date, revenue: f.price, profit: f.profit, ref: b }); });
  S.sales.forEach(s => { const fee = cardFee(s.price, s.card); ev.push({ kind: 'part', date: s.date, revenue: s.price, profit: round2(s.price - (s.item?.cost || 0) - fee), ref: s }); });
  return ev;
}
function monthly() {
  const map = {};
  realizedEvents().forEach(e => {
    const k = isDate(e.date) ? e.date.slice(0, 7) : 'sem-data';
    const m = map[k] || (map[k] = { k, pcs: 0, parts: 0, revenue: 0, profit: 0 });
    if (e.kind === 'pc') m.pcs++; else m.parts++;
    m.revenue += e.revenue; m.profit += e.profit;
  });
  return Object.values(map).sort((a, b) => b.k.localeCompare(a.k));
}

/* ================= Cópia na nuvem (só quando a página roda dentro do Claude) =================
   Os dados ficam sempre no aparelho. Quando o Claude oferece armazenamento privado,
   cada registro também vai para lá, para não se perder e abrir em outro aparelho. */
const Cloud = {
  db: null, root: null, on: false, status: 'local', busy: false, again: false, timer: null, pushed: {}, lastPull: 0,
  cols: { builds: 'builds', inv: 'inv', hist: 'hist', sales: 'sales', offers: 'offers', watch: 'watch', seen: 'seen' },

  async init() {
    if (!window.claude || typeof window.claude.use !== 'function') { this.setStatus('local'); return; }
    this.setStatus('connecting');
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) { this.setStatus('local'); return; }
      const uid = await user.id();
      if (!uid) { this.setStatus('local'); return; }
      this.db = db;
      this.root = db.doc(`data/users/${uid}/pcsgamer`);
      this.on = true;
      await this.sync(true);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && Date.now() - this.lastPull > 20000 && !META.dirty && !Sheet.isOpen()) this.sync(false);
      });
    } catch (e) {
      console.warn('Nuvem indisponível', e);
      this.on = false; this.setStatus('local');
    }
  },
  col(c) { return this.root.collection(this.cols[c]); },
  async readAll(c) {
    const out = [];
    let last = null;
    for (let guard = 0; guard < 100; guard++) {
      let q = this.col(c).orderBy('id').limit(500);
      if (last) q = this.col(c).where('id', '>', last).orderBy('id').limit(500);
      const snap = await q.get();
      snap.docs.forEach(d => { if (d.exists) out.push(clone(d.data())); });
      if (snap.size < 500) break;
      last = out[out.length - 1].id;
    }
    return out;
  },
  // Baixa a nuvem e decide quem vale: sem alterações locais pendentes, vale a nuvem;
  // com pendências, junta registro a registro pelo mais recente.
  async sync(first) {
    if (!this.on) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setStatus('saving');
    try {
      const metaSnap = await this.root.get();
      this.lastPull = Date.now();
      if (!metaSnap.exists) {
        this.pushed = {}; COLLS.forEach(c => { this.pushed[c] = {}; });
        this.busy = false;
        META.dirty = true; saveLocal();
        await this.push();
        return;
      }
      const remote = {};
      for (const c of COLLS) remote[c] = await this.readAll(c);
      const meta = metaSnap.data() || {};
      this.pushed = {};
      COLLS.forEach(c => { this.pushed[c] = {}; remote[c].forEach(r => { this.pushed[c][r.id] = JSON.stringify(r); }); });
      let next;
      if (!META.dirty) {
        next = { v: 1, settings: meta.settings || S.settings };
        COLLS.forEach(c => { next[c] = remote[c]; });
      } else {
        next = { v: 1, settings: (meta.savedAt || 0) > META.savedAt ? (meta.settings || S.settings) : S.settings };
        COLLS.forEach(c => {
          const local = new Map(S[c].map(r => [r.id, r]));
          const out = [];
          remote[c].forEach(r => {
            const l = local.get(r.id);
            if (l) { out.push((l.u || 0) >= (r.u || 0) ? l : r); local.delete(r.id); return; }
            const t = (META.tomb[c] || {})[r.id];
            if (t && (r.u || 0) <= t) return; // apagado aqui depois da última mudança lá
            out.push(r);
          });
          local.forEach(l => out.push(l));
          next[c] = out;
        });
      }
      const before = JSON.stringify(S);
      S = sanitizeState(next);
      buildSnap();
      saveLocal();
      if (JSON.stringify(S) !== before) { applyTheme(); render(); }
      this.busy = false;
      if (META.dirty) await this.push(); else this.setStatus('cloud');
    } catch (e) {
      console.warn('Falha ao sincronizar', e);
      this.busy = false; this.setStatus('error');
    }
    if (this.again) { this.again = false; this.push(); }
  },
  schedule() {
    if (!this.on) { this.setStatus('local'); return; }
    this.setStatus('saving');
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 800);
  },
  async push() {
    if (!this.on) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setStatus('saving');
    const startedAt = META.savedAt;
    try {
      for (const c of COLLS) {
        const map = {};
        S[c].forEach(r => { map[r.id] = JSON.stringify(r); });
        for (const [id, js] of Object.entries(map)) {
          if (this.pushed[c][id] !== js) { await this.col(c).doc(id).set(JSON.parse(js)); this.pushed[c][id] = js; }
        }
        for (const id of Object.keys(this.pushed[c])) {
          if (!map[id]) { await this.col(c).doc(id).delete(); delete this.pushed[c][id]; }
        }
      }
      await this.root.set({ v: 1, savedAt: META.savedAt, settings: clone(S.settings) });
      if (META.savedAt === startedAt) { META.dirty = false; COLLS.forEach(c => { META.tomb[c] = {}; }); saveLocal(); }
      this.setStatus('cloud');
    } catch (e) {
      console.warn('Falha ao enviar', e);
      this.setStatus('error');
      if (e && e.code === 'quota_exceeded') toast('O espaço na nuvem acabou. Seus dados continuam salvos no aparelho.');
    }
    this.busy = false;
    if (this.again) { this.again = false; setTimeout(() => this.push(), 50); }
  },
  setStatus(s) {
    this.status = s;
    const el = $('#sync');
    if (!el) return;
    if (typeof Drive !== 'undefined' && Drive.isOn()) {
      const [dc, dt] = Drive.statusText();
      el.innerHTML = `<span class="dot ${localOk ? dc : 'err'}"></span>${esc(dt)}`;
      if (Drive.state === 'auth') { el.dataset.a = 'drive-connect'; el.style.cursor = 'pointer'; } else { delete el.dataset.a; el.style.cursor = ''; }
      return;
    }
    const map = {
      local: ['ok', localOk ? 'Salvo neste aparelho' : 'Não foi possível salvar'],
      connecting: ['busy', 'Conectando…'],
      saving: ['busy', 'Salvando…'],
      cloud: ['ok', 'Salvo no aparelho e na nuvem'],
      error: ['err', 'Salvo só no aparelho'],
    };
    const [cls, txt] = map[s] || map.local;
    el.innerHTML = `<span class="dot ${localOk ? cls : 'err'}"></span>${esc(txt)}`;
  },
};

/* ================= Componentes ================= */
let toastT = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('in');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('in'), 2600);
}

const Sheet = {
  stack: [],
  isOpen() { return this.stack.length > 0; },
  open({ title, body, onMount, onClose }) {
    const layer = $('#layer');
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    const el = document.createElement('div');
    el.className = 'sheet';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', title);
    el.innerHTML = `<div class="sheet-h"><h2>${esc(title)}</h2><button class="x" data-a="sheet-close" aria-label="Fechar">${IC.x}</button></div><div class="sheet-b">${body}</div>`;
    layer.append(scrim, el);
    const entry = { el, scrim, onClose };
    this.stack.push(entry);
    scrim.addEventListener('click', () => this.close());
    requestAnimationFrame(() => { scrim.classList.add('in'); el.classList.add('in'); });
    document.body.style.overflow = 'hidden';
    if (onMount) onMount(el);
    return el;
  },
  top() { return this.stack[this.stack.length - 1]?.el || null; },
  replace(opts) { this.close(true); return this.open(opts); },
  close(instant) {
    const e = this.stack.pop();
    if (!e) return;
    const { el, scrim, onClose } = e;
    if (instant) { el.remove(); scrim.remove(); }
    else { el.classList.remove('in'); scrim.classList.remove('in'); setTimeout(() => { el.remove(); scrim.remove(); }, 230); }
    if (!this.stack.length) document.body.style.overflow = '';
    if (onClose) onClose();
  },
  closeAll() { while (this.stack.length) this.close(true); },
};
function confirmBox({ title, text, ok = 'Confirmar', cancel = 'Cancelar', danger = false, alt = null, check = null }) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; resolve(v); };
    Sheet.open({
      title,
      body: `<div class="form">${text ? `<p style="margin:0">${text}</p>` : ''}
        ${check ? `<label class="check"><input type="checkbox" id="cf-check" ${check.on ? 'checked' : ''}> ${esc(check.label)}</label>` : ''}
        <div class="sheet-foot" style="flex-wrap:wrap">
          <button class="btn" data-a="cf" data-v="no">${esc(cancel)}</button>
          ${alt ? `<button class="btn" data-a="cf" data-v="alt">${esc(alt)}</button>` : ''}
          <button class="btn ${danger ? 'danger solid' : 'primary'}" data-a="cf" data-v="ok">${esc(ok)}</button>
        </div></div>`,
      onMount: el => {
        el.addEventListener('click', e => {
          const b = e.target.closest('[data-a="cf"]');
          if (!b) return;
          e.stopPropagation();
          const v = b.dataset.v;
          const chk = $('#cf-check', el)?.checked;
          finish(v === 'no' ? false : { choice: v, check: chk });
          Sheet.close();
        });
      },
      onClose: () => finish(false),
    });
  });
}

function monthlyHTML() {
  const rows = monthly();
  if (!rows.length) return `<div class="list"><div class="empty"><b>Nenhuma venda registrada ainda</b>Marque um PC como vendido ou venda uma peça avulsa para ver o resumo.</div></div>`;
  // Gráfico dos últimos 6 meses
  const now = today();
  let y = +now.slice(0, 4), m = +now.slice(5, 7);
  const months = [];
  for (let i = 0; i < 6; i++) { months.unshift(`${y}-${String(m).padStart(2, '0')}`); m--; if (!m) { m = 12; y--; } }
  const byK = Object.fromEntries(rows.map(r => [r.k, r]));
  const vals = months.map(k => byK[k]?.profit || 0);
  const W = 340, H = 150, pad = 22, base0 = H - 24;
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  const span = (max - min) || 1;
  const yOf = v => pad + (max - v) / span * (base0 - pad);
  const bw = 30, gap = (W - 12 - bw * 6) / 5;
  const bars = vals.map((v, i) => {
    const x = 6 + i * (bw + gap);
    const y1 = yOf(Math.max(v, 0)), y2 = yOf(Math.min(v, 0));
    const h = Math.max(v === 0 ? 0 : 2, y2 - y1);
    const col = v < 0 ? 'var(--crit)' : i === 5 ? 'var(--accent)' : 'color-mix(in srgb, var(--accent) 45%, var(--surface-2))';
    return `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" rx="4" fill="${col}"></rect>
      ${v !== 0 ? `<text x="${x + bw / 2}" y="${v >= 0 ? y1 - 5 : y2 + 12}" text-anchor="middle" class="${i === 5 ? 'lbl' : ''}">${shortMoney(v)}</text>` : ''}
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${monthShort(months[i]).split('/')[0]}</text>`;
  }).join('');
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lucro realizado nos últimos 6 meses">
    <line x1="0" x2="${W}" y1="${yOf(0)}" y2="${yOf(0)}" stroke="var(--line-2)" stroke-width="1"></line>${bars}</svg>`;
  const list = rows.slice(0, 12).map(r => `<div class="row">
      <span class="main"><span class="title">${r.k === 'sem-data' ? 'Vendas sem data' : monthLong(r.k)}</span>

  return `<div class="panel"><div class="label" style="margin-bottom:6px">Lucro realizado, últimos 6 meses</div>${chart}</div>
    <div class="list" style="margin-top:10px">${list}</div>`;
}

}

function ago(ms) {

  if (m < 1) return 'agora';
  if (m < 60) return `há ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `há ${h} h`;
  const d = new Date(ms);
  return h < 48 ? 'ontem' : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
}

const capFirst = s => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

function priceChart(recs, offer) {
  const pts = recs.filter(r => isDate(r.date) && r.cost > 0).sort((a, b) => a.date.localeCompare(b.date));
  if (pts.length < 2) return '';
  const W = 340, H = 170, L = 66, R = 10, T = 14, B = 26;
  const xs = pts.map(p => dayNum(p.date));
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x1 === x0) { x0 -= 15; x1 += 15; }
  const vals = pts.map(p => p.cost).concat(offer > 0 ? [offer] : []);
  let y0 = Math.min(...vals), y1 = Math.max(...vals);
  const padY = (y1 - y0) * 0.15 || y1 * 0.1 || 10;
  y0 = Math.max(0, y0 - padY); y1 += padY;
  const X = d => L + (d - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  const avg = pts.reduce((s, p) => s + p.cost, 0) / pts.length;
  const raw = (y1 - y0) / 3, p10 = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const step = [1, 2, 5, 10].map(k => k * p10).find(v => v >= raw) || 10 * p10;
  const ticks = [];
  for (let t = Math.ceil(y0 / step) * step; t <= y1 + 1e-9 && ticks.length < 6; t += step) ticks.push(t);
  const condCol = { nova: 'var(--accent)', usada: 'var(--warn)', reparada: 'var(--ink-2)', '': 'var(--info)' };
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(dayNum(p.date)).toFixed(1)},${Y(p.cost).toFixed(1)}`).join(' ');
  const first = pts[0].date, last = pts[pts.length - 1].date;
  return `<div class="panel" style="margin-top:10px"><div class="label" style="margin-bottom:6px">Quanto você pagou ao longo do tempo</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Preços pagos ao longo do tempo">
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"></line><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${shortMoney(t)}</text>`).join('')}
      <line x1="${L}" x2="${W - R}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--ink-3)" stroke-dasharray="2 4" stroke-width="1.2"></line>
      ${offer > 0 ? `<line x1="${L}" x2="${W - R}" y1="${Y(offer)}" y2="${Y(offer)}" stroke="var(--good)" stroke-dasharray="6 4" stroke-width="1.6"></line><text x="${W - R}" y="${Y(offer) - 5}" text-anchor="end" class="lbl" style="fill:var(--good)">oferta</text>` : ''}
      <path d="${path}" fill="none" stroke="var(--line-2)" stroke-width="1.5"></path>
      ${pts.map(p => `<circle cx="${X(dayNum(p.date)).toFixed(1)}" cy="${Y(p.cost).toFixed(1)}" r="4" fill="${condCol[p.cond || '']}" stroke="var(--surface)" stroke-width="1.5"></circle>`).join('')}
      <text x="${L}" y="${H - 6}">${fmtDate(first).replace(/\/(\d\d)(\d\d)$/, '/$2')}</text>${last !== first ? `<text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(last).replace(/\/(\d\d)(\d\d)$/, '/$2')}</text>` : ''}
    </svg>

function histRow(h) {
  return `<button class="row" data-a="hist" data-id="${h.id}"><span class="main"><span class="title">${esc(h.name)}</span>
    <span class="sub">${esc(joinDot(CAT[h.cat]?.l, condLabel(h.cond), h.date ? fmtDate(h.date) : 'sem data', h.kind === 'manual' ? 'lançamento manual' : 'do estoque'))}</span></span>
    <span class="end"><span class="v">${money(h.cost)}</span></span></button>`;

function pricesResults() {
  const q = UI.q, offer = parseMoney(q.offer);
  if (!q.text.trim()) {
    const rec = S.hist.filter(h => !q.cat || h.cat === q.cat).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.u || 0) - (a.u || 0)).slice(0, 6);
    return `<div class="sec"><div class="label" style="margin:2px 2px 8px">Compras mais recentes</div>
      ${rec.length ? `<div class="list">${rec.map(histRow).join('')}</div>` : `<div class="list"><div class="empty"><b>Histórico vazio</b>Toda peça cadastrada no estoque entra aqui sozinha. Compras antigas você lança no botão abaixo.</div></div>`}
      ${S.hist.length > 6 ? `<p class="hint" style="margin:8px 2px 0">${S.hist.length} compras registradas. Digite um modelo para filtrar.</p>` : ''}</div>`;
  }
  const m = histFind(q.cat, q.text);
  if (!m.length) return `<div class="sec"><div class="list"><div class="empty"><b>Nenhuma compra parecida no seu histórico</b>Tente escrever só o modelo, como “6600” ou “B450”.</div></div></div>`;
  const costs = m.map(h => h.cost);
  const avg = costs.reduce((s, v) => s + v, 0) / costs.length;
  const lo = Math.min(...costs), hi = Math.max(...costs);
  const last = m[0];
  let verdict = '';
  if (offer > 0) {
    const diff = offer - avg, dp = avg > 0 ? diff / avg * 100 : 0;
    const cls = dp <= -5 ? 'good' : dp >= 5 ? 'bad' : 'mid';
    const txt = Math.abs(dp) < 0.5 ? 'Oferta igual à sua média.' : `Oferta ${money(Math.abs(diff))} (${NUM1.format(Math.abs(dp))}%) ${diff < 0 ? 'abaixo' : 'acima'} da sua média.`;
    verdict = `<div class="verdict ${cls}">${txt}${offer < lo ? ' Mais barato que qualquer compra sua.' : offer > hi ? ' Mais caro que qualquer compra sua.' : ''}</div>`;
  }
  return `<div class="panel" style="margin-top:14px">
      <div class="label" style="margin-bottom:10px">${plural(m.length, 'compra parecida', 'compras parecidas')}</div>
      <div class="stats">
        <div><div class="k">Média paga</div><div class="v">${money(avg)}</div></div>
        <div><div class="k">Última compra</div><div class="v">${money(last.cost)}</div><div class="hint">${last.date ? fmtDate(last.date) : 'sem data'}</div></div>
        <div><div class="k">Menor</div><div class="v good">${money(lo)}</div></div>
        <div><div class="k">Maior</div><div class="v bad">${money(hi)}</div></div>
      </div>${verdict}</div>
    ${priceChart(m, offer)}
    <div class="sec"><div class="list">${m.slice(0, 12).map(histRow).join('')}</div>
    ${m.length > 12 ? `<p class="hint" style="margin:8px 2px 0">Mostrando as 12 mais recentes. A média usa todas as ${m.length}.</p>` : ''}</div>`;
}

/* ================= Formulário de peça ================= */
function specFields(cat, sp) {
  sp = sp || {};
  if (cat === 'ram') {
    const gbs = RAM_GB.includes(sp.gb) || !sp.gb ? RAM_GB : [...RAM_GB, sp.gb].sort((a, b) => a - b);
    return `<div class="grid3">
      <label class="field"><span>Capacidade total</span><select id="pf-gb"><option value="">—</option>${gbs.map(g => `<option value="${g}" ${sp.gb === g ? 'selected' : ''}>${g} GB</option>`).join('')}</select></label>
      <label class="field"><span>Tipo</span><select id="pf-type"><option value="">—</option>${['DDR3', 'DDR4', 'DDR5'].map(t => `<option ${sp.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label class="field"><span>Pentes</span><select id="pf-sticks"><option value="">—</option>${[1, 2, 4].map(n => `<option value="${n}" ${sp.sticks === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    </div>`;
  }
  if (cat === 'nvme' || cat === 'sata') {
    const gbs = DISK_GB.includes(sp.gb) || !sp.gb ? DISK_GB : [...DISK_GB, sp.gb].sort((a, b) => a - b);
    return `<label class="field"><span>Capacidade</span><select id="pf-gb"><option value="">—</option>${gbs.map(g => `<option value="${g}" ${sp.gb === g ? 'selected' : ''}>${gbLabel(g)}</option>`).join('')}</select></label>`;
  }
  if (cat === 'psu') return `<label class="field"><span>Potência</span><div class="unit-in"><input type="text" inputmode="numeric" id="pf-w" value="${sp.w || ''}" placeholder="Ex.: 550"><em>W</em></div></label>`;
  if (cat === 'gpu') return `<label class="field"><span>Consumo (opcional)</span><div class="unit-in"><input type="text" inputmode="numeric" id="pf-w" value="${sp.w || ''}" placeholder=""><em>W</em></div><span class="hint" id="pf-wh"></span></label>`;
  return '';
}
function readSpecs(root, cat) {
  const v = id => $('#' + id, root)?.value;
  if (cat === 'ram') return cleanSpecs(cat, { gb: +v('pf-gb') || 0, type: v('pf-type') || '', sticks: +v('pf-sticks') || 0 });
  if (cat === 'nvme' || cat === 'sata') return cleanSpecs(cat, { gb: +v('pf-gb') || 0 });
  if (cat === 'psu' || cat === 'gpu') return cleanSpecs(cat, { w: parseIntSafe(v('pf-w')) });
  return {};
}
// mode: 'item' (estoque/compra), 'plan' (planejada), 'hist' (compra antiga)

function namePlaceholder(cat) {
  return { cpu: 'Ex.: Intel Core i5-9400F', cooler: 'Ex.: Rise Mode Z4 ARGB', gpu: 'Ex.: ASUS Dual RX 6600 8GB', mobo: 'Ex.: Gigabyte B450M DS3H', ram: 'Ex.: Kingston Fury 16GB (2x8) DDR4 3200', nvme: 'Ex.: Kingston NV2 500GB', sata: 'Ex.: SSD Crucial BX500 480GB', psu: 'Ex.: MSI MAG A550BN 550W', case: 'Ex.: Gabinete aquário Rise Mode Glass 06', fans: 'Ex.: Kit 3 fans ARGB' }[cat] || '';
}
function mountPartForm(root) {
  const pf = $('#pf', root);
  const curCat = () => $('#pf-cat', root)?.value || pf.dataset.cat;
  const refresh = () => {
    const cat = curCat();
    const name = $('#pf-name', root).value;
    const det = detectLine(cat, name);
    $('#pf-detect', root).innerHTML = det ? `<div class="detect" style="margin-top:6px">${esc(det)}</div>` : '';
    const wh = $('#pf-wh', root);
    if (wh) { const g = parseGPU(name); wh.textContent = g && !g.igpu ? `Em branco, uso ${g.w} W (típico da ${g.label}).` : 'Preencha se o modelo não for reconhecido.'; }
    const sug = pf.dataset.mode === 'plan' && !name ? [] : nameSuggestions(cat, name);
    $('#pf-sugg', root).innerHTML = sug.length && document.activeElement === $('#pf-name', root)
      ? `<div class="sugg" style="margin-top:6px">${sug.map((s, i) => `<button type="button" data-a="pf-sugg" data-i="${i}"><span>${esc(s.name)}</span><span>${s.cost ? money(s.cost) : ''}${s.date ? ' · ' + fmtDate(s.date).slice(3) : ''}</span></button>`).join('')}</div>` : '';
    pf._sugg = sug;
  };
  const fillGuess = () => {
    const cat = curCat();
    const g = guessSpecs(cat, $('#pf-name', root).value);
    const set = (id, v) => { const el = $('#' + id, root); if (el && !el.value && v) el.value = String(v); };
    set('pf-gb', g.gb); set('pf-type', g.type); set('pf-sticks', g.sticks); set('pf-w', g.w);
  };
  const lastPaid = (name) => {
    const el = $('#pf-last', root);
    if (!el) return;
    const m = name ? histFind(curCat(), name) : [];
    el.textContent = m.length ? `Última compra parecida: ${money(m[0].cost)}${m[0].date ? ' em ' + fmtDate(m[0].date) : ''} · média ${money(m.reduce((s, h) => s + h.cost, 0) / m.length)}` : '';
    el.hidden = !m.length;
  };
  $('#pf-name', root).addEventListener('input', () => { refresh(); fillGuess(); });
  $('#pf-name', root).addEventListener('focus', refresh);
  $('#pf-name', root).addEventListener('blur', () => {
    setTimeout(() => {
      if (pf._picking) return;
      if ($('#pf-sugg', root)) $('#pf-sugg', root).innerHTML = '';
      lastPaid($('#pf-name', root).value);
    }, 200);
  });
  root.addEventListener('pointerdown', e => { if (e.target.closest('[data-a="pf-sugg"]')) pf._picking = true; });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-a="pf-sugg"]');
    if (!b) return;
    e.stopPropagation();
    pf._picking = false;
    const s = pf._sugg?.[+b.dataset.i];
    if (!s) return;
    $('#pf-name', root).value = s.name;
    const sp = s.specs || {};
    const set = (id, v) => { const el = $('#' + id, root); if (el && !el.value && v) el.value = String(v); };
    set('pf-gb', sp.gb); set('pf-type', sp.type); set('pf-sticks', sp.sticks); set('pf-w', sp.w);
    fillGuess();
    $('#pf-sugg', root).innerHTML = '';
    refresh();
    $('#pf-sugg', root).innerHTML = '';
    lastPaid(s.name);
    $('#pf-cost', root).focus();
  });
  const catSel = $('#pf-cat', root);
  if (catSel) catSel.addEventListener('change', () => {
    const sp = $('#pf-specs', root);
    if (sp) sp.innerHTML = specFields(catSel.value, {});
    $('#pf-name', root).placeholder = namePlaceholder(catSel.value);
    fillGuess(); refresh(); lastPaid($('#pf-name', root).value);
  });
  refresh();
  $('#pf-sugg', root).innerHTML = '';
  lastPaid($('#pf-name', root).value);
}
function readPartForm(root) {
  const pf = $('#pf', root);
  const cat = $('#pf-cat', root)?.value || pf.dataset.cat;
  return {
    cat,
    name: $('#pf-name', root).value.trim(),
    cost: parseMoney($('#pf-cost', root).value),
    cond: segVal(root, 'cond') || '',
    date: $('#pf-date', root)?.value || '',

/* ================= Estoque e histórico ================= */
function createItem(d) {
  const it = { id: newId(), code: S.settings.nextCode++, cat: d.cat, name: d.name, cost: d.cost, cond: d.cond, status: d.status || 'disp', date: isDate(d.date) ? d.date : today(), specs: cleanSpecs(d.cat, d.specs), buildId: null, createdAt: Date.now() };
  S.inv.push(it);
  S.hist.push({ id: newId(), invId: it.id, cat: it.cat, name: it.name, cost: it.cost, cond: it.cond, date: it.date, specs: clone(it.specs), kind: 'auto', createdAt: Date.now() });
  return it;
}
function syncHistFromItem(it) {
  const h = S.hist.find(x => x.invId === it.id);
  if (!h) return;
  Object.assign(h, { cat: it.cat, name: it.name, cost: it.cost, cond: it.cond, date: it.date, specs: clone(it.specs || {}) });
}
function updateItem(it, d) {
  const catChanged = d.cat && d.cat !== it.cat;
  Object.assign(it, { name: d.name, cost: d.cost, cond: d.cond, date: isDate(d.date) ? d.date : it.date, specs: cleanSpecs(d.cat || it.cat, d.specs) });
  if (d.status) it.status = d.status;
  if (catChanged) {
    // Mudou de categoria: sai do PC onde estava
    if (it.buildId) unlinkItem(it);
    it.cat = d.cat;
  }
  syncHistFromItem(it);
  const b = it.buildId ? findBuild(it.buildId) : null;
  if (b) { const sl = b.slots[it.cat]; if (sl && sl.mode === 'inv' && sl.invId === it.id) sl.snap = snapOf(it); }
}
const snapOf = it => ({ id: it.id, code: it.code, cat: it.cat, name: it.name, cost: it.cost, cond: it.cond, date: it.date, specs: clone(it.specs || {}), status: it.status });
function linkItem(b, it) {
  const cat = it.cat;
  const cur = b.slots[cat];
  if (cur && cur.mode === 'inv' && cur.invId !== it.id) { const old = findInv(cur.invId); if (old) old.buildId = null; }
  if (it.buildId && it.buildId !== b.id) { const ob = findBuild(it.buildId); if (ob && ob.slots[cat]?.invId === it.id) delete ob.slots[cat]; }
  b.slots[cat] = { mode: 'inv', invId: it.id, snap: snapOf(it) };
  it.buildId = b.id;
}
function unlinkItem(it) {
  const b = it.buildId ? findBuild(it.buildId) : null;
  if (b) { const sl = b.slots[it.cat]; if (sl && sl.mode === 'inv' && sl.invId === it.id) delete b.slots[it.cat]; }
  it.buildId = null;
}

    created = createItem({ ...d, cat });

function doSell(id) {
  const b = findBuild(id);
  const root = Sheet.top();
  const price = parseMoney($('#sell-price', root).value);
  const date = $('#sell-date', root).value;
  const card = !!$('#sell-card', root)?.checked;
  CATS.forEach(c => {
    const sl = b.slots[c.k];
    if (sl && sl.mode === 'inv') {
      const it = findInv(sl.invId) || sl.snap;
      if (it) b.slots[c.k] = { mode: 'sold', item: snapOf(it) };
      else delete b.slots[c.k];
      S.inv = S.inv.filter(i => i.id !== sl.invId);
    }
  });
  b.status = 'vendido';
  b.sale = { price, date: isDate(date) ? date : '', card };
  Sheet.close();
  gotoPC(b.id);
  toast('Venda registrada. O PC foi para Vendidos.');
}
function openUndoSale(b, target) {
  const n = CATS.filter(c => b.slots[c.k]?.mode === 'sold').length;
  confirmBox({
    title: 'Desfazer venda',
    text: `${esc(b.name)} volta para “${STATUS[target]}”. O valor e a data da venda serão apagados.`,
    check: n ? { label: `Devolver as ${n} peças ao estoque, vinculadas a este PC`, on: true } : null,
    ok: 'Desfazer venda',
  }).then(r => {
    if (!r) return;
    if (r.check) {
      CATS.forEach(c => {
        const sl = b.slots[c.k];
        if (sl && sl.mode === 'sold') {
          const src = sl.item;
          const it = { id: src.id && !findInv(src.id) ? src.id : newId(), code: src.code || S.settings.nextCode++, cat: c.k, name: src.name, cost: round2(src.cost), cond: condOk(src.cond), status: 'disp', date: isDate(src.date) ? src.date : '', specs: cleanSpecs(c.k, src.specs), buildId: null, createdAt: Date.now() };
          S.inv.push(it);
          linkItem(b, it);
        }
      });
    } else {
      CATS.forEach(c => { const sl = b.slots[c.k]; if (sl && sl.mode === 'sold') b.slots[c.k] = { mode: 'plan', name: sl.item.name, cost: round2(sl.item.cost), specs: cleanSpecs(c.k, sl.item.specs) }; });
    }
    b.status = target;
    b.sale = { price: 0, date: '', card: false };
    b.readyAt = target === 'estoque' ? today() : null;
    gotoPC(b.id);
    toast('Venda desfeita');
  });
}

function readAdForm(el, b) {

  if (t) o.title = t;
  ['cond', 'os', 'terms', 'notes'].forEach(k => { const x = v('adf-' + k); if (x !== d[k]) o[k] = x; });
  return o;

async function copyText(t, okMsg) {
  if (NATIVE && nativeCall('copy', t)) { toast(okMsg); return true; }
  try { await navigator.clipboard.writeText(t); toast(okMsg); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    if (ok) { toast(okMsg); return true; }
    Sheet.open({ title: 'Copie o texto', body: `<p class="hint" style="margin-top:0">Não consegui copiar sozinho. Toque e segure no texto para copiar.</p><textarea readonly style="min-height:260px">${esc(t)}</textarea>` });
    return false;
  }
}

function searchResults(q) {

  const onlyCode = q.startsWith('#');
  const nameOk = n => !onlyCode && matchName(q, n);
  const pcs = S.builds.filter(b => nameOk(b.name) || (!onlyCode && b.notes && norm(b.notes).includes(norm(q))) || CATS.some(c => { const p = slotPart(b, c.k); return p && (nameOk(p.name) || (byCode && p.code === byCode)); })).slice(0, 8);
  const inv = S.inv.filter(i => (byCode && i.code === byCode) || nameOk(i.name)).slice(0, 8);
  const sales = S.sales.filter(s => (byCode && s.item?.code === byCode) || nameOk(s.item?.name)).slice(0, 5);
  const hist = onlyCode ? [] : histFind('', q).slice(0, 8);
  if (!pcs.length && !inv.length && !hist.length && !sales.length) return `<div class="empty"><b>Nada encontrado</b>Tente só o modelo, como “6600”, ou um código como #12.</div>`;

  if (inv.length) h += `<div class="label res-h">Estoque</div><div class="list">${inv.map(i => `<button class="row" data-a="item" data-id="${i.id}"><span class="tag">${code(i.code)}</span><span class="main"><span class="title">${esc(i.name)}</span><span class="sub">${CAT[i.cat].l}${i.buildId ? ' · no ' + esc(findBuild(i.buildId)?.name || 'PC') : i.status === 'caminho' ? ' · a caminho' : ' · disponível'}</span></span><span class="end v">${money(i.cost)}</span></button>`).join('')}</div>`;
  if (sales.length) h += `<div class="label res-h">Vendas avulsas</div><div class="list">${sales.map(s => `<button class="row" data-a="sale" data-id="${s.id}"><span class="tag">${code(s.item?.code)}</span><span class="main"><span class="title">${esc(s.item?.name)}</span><span class="sub">vendida por ${money(s.price)}</span></span></button>`).join('')}</div>`;
  if (hist.length) h += `<div class="label res-h">Histórico de preços</div><div class="list">${hist.map(histRow).join('')}</div>`;
  return h;
}

/* Backup */
function backupJSON() {
  return JSON.stringify({ app: 'pcs-gamer', version: 1, exportedAt: new Date().toISOString(), data: S }, null, 1);
}
async function doBackup() {
  const name = `pcs-gamer-backup-${today()}.json`;
  const data = backupJSON();
  const markDone = () => { S.settings.lastBackup = Date.now(); commit(); toast('Backup gerado. Guarde o arquivo no Google Drive.'); };
  if (NATIVE) {
    // No Android abre o menu de compartilhar: escolha o Google Drive
    if (nativeCall('shareFile', name, data)) { S.settings.lastBackup = Date.now(); commit(); toast('Escolha o Google Drive para guardar o backup.'); }
    else toast('Não consegui gerar o arquivo. Use “Copiar como texto”.');
    return;
  }
  let dl = null;
  try { dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data }); markDone(); }
    catch (e) {
      if (e && e.code === 'declined') toast('Backup cancelado.');
      else if (e && e.code === 'rate_limited') toast('Aguarde um instante e tente de novo.');
      else { toast('Não deu para gerar o arquivo aqui. Use “Copiar como texto”.'); }
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markDone();
  } catch (e) { toast('Não deu para gerar o arquivo aqui. Use “Copiar como texto”.'); }
}
function parseBackup(text) {
  let o;
  try { o = JSON.parse(text); } catch (e) { return { err: 'O texto não é um backup válido do PCs Gamer.' }; }
  if (!o || o.app !== 'pcs-gamer' || !o.data || typeof o.data !== 'object') return { err: 'Este arquivo não é um backup do PCs Gamer.' };
  return { data: o.data, when: o.exportedAt };
}
function confirmRestore(text) {
  const r = parseBackup(text);
  if (r.err) { toast(r.err); return; }
  const st = sanitizeState(r.data);
  const when = r.when ? new Date(r.when) : null;
  confirmBox({
    title: 'Restaurar backup',
    text: `Backup${when && !isNaN(when) ? ` de ${when.toLocaleDateString('pt-BR')}` : ''} com ${plural(st.builds.length, 'PC', 'PCs')}, ${plural(st.inv.length, 'peça', 'peças')} no estoque e ${plural(st.hist.length, 'compra', 'compras')} no histórico.<br><br><b>Os dados atuais deste aparelho serão substituídos.</b>`,
    ok: 'Restaurar', danger: true,
  }).then(ok => {
    if (!ok) return;
    const now = Date.now();
    for (const c of COLLS) { const keep = new Set(st[c].map(x => x.id)); S[c].forEach(x => { if (!keep.has(x.id)) META.tomb[c][x.id] = now; }); }

}

const GOOGLE_CLIENT_ID = '318618849978-3475lj8mbrg6v6uc5u65b42r8rohlk7d.apps.googleusercontent.com';

    return raw ? res.text() : res.json();
  },
  async findFile() {
    const q = encodeURIComponent(`name='${DRIVE_NAME}' and trashed=false`);
    const r = await this.api('GET', `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc`);
    return r.files && r.files[0] ? r.files[0].id : '';
  },
  async download(id) { return this.api('GET', `https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { raw: true }); },
  async create(content) {
    const b = 'pcsgamer' + Date.now();
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_NAME, parents: ['appDataFolder'] })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${b}--`;
    const r = await this.api('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { body, type: 'multipart/related; boundary=' + b });
    return r.id;
  },
  async update(id, content) {
    return this.api('PATCH', `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id`, { body: content, type: 'application/json' });
  },

  /* ---------- Sincronizar ---------- */
  schedule() {
    if (!this.isOn()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.sync('alteração'), 3000);
  },
  async sync(reason, interactive) {
    if (!this.isOn()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.setState('syncing');
    try {
      if (interactive) await this.getToken(true);
      let id = this.cfg.fileId;
      let remoteText = null;
      if (id) {
        try { remoteText = await this.download(id); }
        catch (e) { if (e.status === 404) { id = ''; } else throw e; }
      }
      if (!id) { id = await this.findFile(); if (id) remoteText = await this.download(id); }
      let remote = null;
      if (remoteText) { try { remote = JSON.parse(remoteText); } catch (e) { remote = null; } }
      if (remote && remote.app !== 'pcs-gamer-sync') remote = null;

      const local = localPayload();
      const merged = mergePayloads(local, remote);
      const changedHere = applyPayload(merged);
      const out = JSON.stringify(normalizePayload(merged));
      if (!remote || out !== JSON.stringify(normalizePayload(remote))) {
        if (id) await this.update(id, out); else id = await this.create(out);
      }
      this.cfg.fileId = id;
      this.cfg.lastSync = Date.now();
      this.save();
      this.err = '';
      this.setState('ok');
      if (changedHere) { pullNativeOffers(); nativeSync(); render(); }
    } catch (e) {
      this.err = (e && e.message) || 'Falha ao sincronizar.';
      this.setState(e && e.code === 'auth' ? 'auth' : 'error');
      console.warn('Drive', reason, e);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; setTimeout(() => this.sync('fila'), 500); }
    }
  },
  async connect() {
    this.cfg.on = true; this.save();
    this.token = '';
    await this.sync('conectar', true);
    if (this.state === 'ok') {
      toast('Conectado ao Google Drive');
      if (!this.poll) this.init();
    } else if (this.state === 'auth') {
      this.cfg.on = false; this.save();
      toast(this.err === 'popup' ? 'Permita janelas pop-up deste site e tente de novo.' : this.err);
    }
    render();
  },
  disconnect() {
    this.cfg = { on: false, fileId: '', lastSync: 0 }; this.save();
    this.token = ''; this.setState('off');
    try { sessionStorage.removeItem('pcsgamer.drive.token'); } catch (e) {}
    if (NATIVE) nativeCall('driveSignOut');
    clearInterval(this.poll); this.poll = null;
    render();
  },
  setState(s) { this.state = s; Cloud.setStatus(Cloud.status); },
  statusText() {
    if (this.state === 'syncing') return ['busy', 'Sincronizando com o Drive…'];
    if (this.state === 'ok') return ['ok', 'Sincronizado com o Drive'];
    if (this.state === 'auth') return ['err', NATIVE ? 'Toque para reconectar ao Drive' : 'Toque para sincronizar com o Drive'];
    if (this.state === 'error') return ['err', 'Sem sincronizar · salvo no aparelho'];
    return ['busy', 'Conectando ao Drive…'];
  },
};
// Resposta do Android ao pedido de login
window.pcgDriveToken = (token, error, expiresIn) => { if (Drive.pending) Drive.pending(token ? { token, expiresIn: +expiresIn || 3300 } : { error: error || 'O acesso ao Drive não foi liberado.' }); };

/* ---------- Junção dos dados ---------- */
function localPayload() {
  const data = {};
  COLLS.forEach(c => { data[c] = S[c]; });
  return { app: 'pcs-gamer-sync', v: 1, settings: S.settings, settingsAt: META.settingsAt || 0, tomb: META.dtomb || {}, data };
}
function normalizePayload(p) {
  const out = { app: 'pcs-gamer-sync', v: 1, settings: p.settings || null, settingsAt: +p.settingsAt || 0, tomb: {}, data: {} };
  COLLS.forEach(c => {
    out.tomb[c] = (p.tomb && p.tomb[c]) || {};
    out.data[c] = Array.isArray(p.data && p.data[c]) ? p.data[c] : [];
  });
  return out;
}
function mergePayloads(L, R) {
  L = normalizePayload(L);
  if (!R) return L;
  R = normalizePayload(R);
  const cut = Date.now() - TOMB_DAYS * 864e5;
  const out = { app: 'pcs-gamer-sync', v: 1, tomb: {}, data: {} };
  COLLS.forEach(c => {
    const tomb = {};
    [R.tomb[c], L.tomb[c]].forEach(t => Object.entries(t || {}).forEach(([id, ts]) => { if (ts > cut && !(tomb[id] >= ts)) tomb[id] = ts; }));
    const byId = new Map();
    [R.data[c], L.data[c]].forEach(list => list.forEach(r => {
      if (!r || typeof r.id !== 'string') return;
      const cur = byId.get(r.id);
      if (!cur || (+r.u || 0) > (+cur.u || 0)) byId.set(r.id, r);
    }));
    out.data[c] = [...byId.values()].filter(r => !(tomb[r.id] >= (+r.u || 0)) && !(c === 'offers' && !(+r.at > Date.now() - 30 * 864e5)));
    out.tomb[c] = tomb;
  });
  const useLocal = L.settings && (!R.settings || L.settingsAt >= R.settingsAt);
  out.settings = useLocal ? L.settings : R.settings;
  out.settingsAt = Math.max(L.settingsAt, R.settingsAt);
  // Ordem estável para comparar com o que está no Drive
  COLLS.forEach(c => out.data[c].sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)));
  return out;
}
// Coloca o resultado da junção no app. Devolve true se algo mudou aqui.
function applyPayload(p) {
  const before = JSON.stringify(COLLS.map(c => S[c].map(r => r.id + ':' + (r.u || 0)).sort())) + JSON.stringify(S.settings);
  const next = { v: 1, settings: p.settings || S.settings };
  COLLS.forEach(c => { next[c] = p.data[c].map(r => clone(r)); });
  const st = sanitizeState(next);
  // sanitizeState pode ajustar registros; mantém o carimbo de tempo original
  COLLS.forEach(c => { const u = new Map(p.data[c].map(r => [r.id, r.u])); st[c].forEach(r => { if (u.has(r.id)) r.u = u.get(r.id); }); });
  const after = JSON.stringify(COLLS.map(c => st[c].map(r => r.id + ':' + (r.u || 0)).sort())) + JSON.stringify(st.settings);
  META.dtomb = p.tomb;
  META.settingsAt = p.settingsAt;
  if (before === after) { saveLocal(); return false; }
  S = st;
  buildSnap();
  saveLocal();
  return true;
}

/* ---------- Tela ---------- */
function driveSectionHTML() {
  if (!Drive.available()) return '';
  const on = Drive.cfg.on;
  const last = Drive.cfg.lastSync ? new Date(Drive.cfg.lastSync) : null;
  const when = last ? `${last.toLocaleDateString('pt-BR')} às ${last.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}` : 'ainda não sincronizou';
  const body = on ? `<div class="panel form">
      <p style="margin:0"><b>${Drive.state === 'auth' ? 'Precisa reconectar' : Drive.state === 'error' ? 'Não sincronizou' : 'Conectado'}</b> · última sincronização: ${esc(when)}</p>
      ${Drive.err && Drive.state !== 'ok' && Drive.err !== 'popup' ? `<p class="hint" style="margin:0">${esc(Drive.err)}</p>` : ''}
      <p class="hint" style="margin:0">Seus dados ficam numa pasta oculta do seu Google Drive, que só o PCs Gamer acessa, e sincronizam entre o celular e o computador.</p>
      <div class="btns">
        ${Drive.state === 'auth' ? `<button class="btn primary" data-a="drive-connect">Reconectar</button>` : `<button class="btn primary" data-a="drive-sync">${IC.refresh} Sincronizar agora</button>`}
        <button class="btn" data-a="drive-off">Desconectar</button>
      </div></div>`
    : `<div class="panel form">
      <p style="margin:0">Conecte sua conta do Google para sincronizar os dados entre o celular e o computador. Eles ficam numa pasta oculta do seu Drive, que só o PCs Gamer acessa.</p>
      <button class="btn primary" data-a="drive-connect">Conectar ao Google Drive</button></div>`;
  return sec('s-drive', 'Google Drive', body);
}

  },
  'restore-paste-ok': () => { const t = $('#rp-text', Sheet.top()).value.trim(); if (!t) { toast('Cole o texto do backup.'); return; } confirmRestore(t); },
  'sync-now': async () => { if (META.dirty) await Cloud.push(); await Cloud.sync(false); render(); toast(Cloud.status === 'cloud' ? 'Dados atualizados' : 'Não foi possível falar com a nuvem agora'); },
  'ad-defaults': () => { S.settings.ad = { ...DEFAULT_AD }; commit(); toast('Texto original restaurado'); },
  wipe: () => {
    confirmBox({
      title: 'Apagar tudo',
      text: 'Isso apaga todos os PCs, peças, vendas e o histórico de preços. Não dá para desfazer sem um backup.',
      check: { label: 'Entendo e quero apagar tudo', on: false }, ok: 'Apagar tudo', danger: true,
    }).then(r => {
      if (!r) return;
      if (!r.check) { toast('Marque a confirmação para apagar.'); return; }
      const theme = S.settings.theme;
      S = blankState();
      S.settings.theme = theme;
      UI.tab = 'home';
      commit(); toast('Dados apagados');
    });
  },
  seg: t => {
    const seg = t.closest('.seg');
    $$('button', seg).forEach(x => x.setAttribute('aria-pressed', String(x === t)));
    if (seg.dataset.name === 'theme' && !t.closest('.sheet')) { S.settings.theme = t.dataset.v; commit(); }
  },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.a];
  if (fn) { e.preventDefault(); fn(t, e); }
});

function refreshLive(b) {
  const n = $('#nums-' + b.id); if (n) n.innerHTML = numsHTML(b);
  const c = $('#calc-' + b.id); if (c) c.innerHTML = calcHTML(b);
  const g = $('#tgt-' + b.id); if (g) g.innerHTML = targetHTML(b);
}
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset?.f;
  if (!f) return;
  const b = el.dataset.id ? findBuild(el.dataset.id) : null;
  switch (f) {
    case 'b-price': if (b) { b.price = parseMoney(el.value); commitQuiet(); refreshLive(b); } break;
    case 's-price': if (b) { b.sale.price = parseMoney(el.value); commitQuiet(); refreshLive(b); } break;
    case 'b-notes': if (b) { b.notes = el.value; commitQuiet(); } break;
    case 'b-target': if (b) { UI.target = UI.target || {}; UI.target[b.id] = parseMoney(el.value); const g = $('#tgt-' + b.id); if (g) g.innerHTML = targetHTML(b); } break;
    case 'q-text': UI.q.text = el.value; $('#q-res').innerHTML = pricesResults(); break;
    case 'q-offer': UI.q.offer = el.value; $('#q-res').innerHTML = pricesResults(); break;
    case 'w-name': refreshWatchRec(); break;
    case 'seen-q': UI.seenQ = el.value; { const l = $('#seen-list'); if (l) l.innerHTML = seenListHTML(); } break;
    case 'set-ad': S.settings.ad[el.dataset.k] = el.value; commitQuiet(); break;
    case 'card-pct': S.settings.card.pct = Math.min(parseMoney(el.value), 30); commitQuiet(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset?.f;
  if (el.id === 'restore-file' || el.id === 'restore-file2') {
    const file = el.files && el.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => { el.value = ''; Sheet.closeAll(); confirmRestore(String(r.result || '')); };
    r.onerror = () => toast('Não consegui ler o arquivo.');
    r.readAsText(file);
    return;
  }
  if (!f) return;
  const b = el.dataset.id ? findBuild(el.dataset.id) : null;
  switch (f) {
    case 'b-name': if (b) { const v = el.value.trim(); if (v) b.name = v; else el.value = b.name; stamp(); refreshCard(b); } break;
    case 'b-price': if (b) { b.price = parseMoney(el.value); el.value = moneyIn(b.price); stamp(); refreshCard(b); } break;
    case 's-price': if (b) { b.sale.price = parseMoney(el.value); el.value = moneyIn(b.sale.price); stamp(); refreshCard(b); } break;
    case 's-date': if (b) { b.sale.date = isDate(el.value) ? el.value : ''; stamp(); refreshCard(b); } break;
    case 's-card': if (b) { b.sale.card = el.checked; stamp(); refreshCard(b); } break;
    case 'b-notes': if (b) { b.notes = el.value; stamp(); } break;
    case 'stock-cat': UI.stockCat = el.value; render(); break;
    case 'q-cat': UI.q.cat = el.value; $('#q-res').innerHTML = pricesResults(); break;
    case 'w-kind': refreshWatchRec(); break;
    case 'card-on': S.settings.card.on = el.checked; commit(); break;
    case 'card-pct': S.settings.card.pct = Math.min(parseMoney(el.value), 30); el.value = S.settings.card.pct ? NUM2.format(S.settings.card.pct) : ''; stamp(); break;
    case 'of-tol': S.settings.offers.tol = Math.min(50, parseMoney(el.value)); el.value = NUM1.format(S.settings.offers.tol).replace(',0', ''); stamp(); break;
    case 'of-groups': S.settings.offers.groups = el.value.split('\n').map(g => g.trim()).filter(Boolean); stamp(); break;
    case 'stale': S.settings.staleDays = Math.min(365, Math.max(1, parseIntSafe(el.value) || 30)); el.value = S.settings.staleDays; stamp(); break;
    case 'set-ad': S.settings.ad[el.dataset.k] = el.value; stamp(); break;
  }
});
// Formata valores em reais ao sair do campo
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.matches && el.matches('.money-in input') && !el.dataset.f) el.value = moneyIn(parseMoney(el.value));
});
// Guarda o que está pendente ao sair do app
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && quietTimer) { clearTimeout(quietTimer); quietTimer = null; stamp(); } });

/* Mantém o foco no mesmo campo quando a tela é redesenhada */
const _render = render;
let rendering = false, rerender = false;
render = function () {
  if (rendering) { rerender = true; return; }
  rendering = true;
  try { doRender(); } finally { rendering = false; }
  if (rerender) { rerender = false; render(); }
};
function doRender() {
  const ae = document.activeElement;
  const fid = ae && ae.id && ae.closest && ae.closest('#main') ? ae.id : null;
  _render();
  if (fid) {
    const n = document.getElementById(fid);
    if (n && n.focus) { n.focus({ preventScroll: true }); if (typeof n.setSelectionRange === 'function' && n.type === 'text') { try { const L = n.value.length; n.setSelectionRange(L, L); } catch (e) {} } }
  }
}

/* Início */
$('#brand-mark').innerHTML = IC.pc;
$('#search-btn').innerHTML = IC.search;
$('#add-btn').innerHTML = IC.plus;
$('#nav').innerHTML = [['home', 'Início', IC.home], ['pcs', 'PCs', IC.pc], ['stock', 'Estoque', IC.box], ['prices', 'Ofertas', IC.tag], ['settings', 'Ajustes', IC.sliders]]
  .map(([k, l, i]) => `<button class="tab" data-a="tab" data-tab="${k}">${i}<span>${l}</span></button>`).join('');
loadLocal();
// Até a versão 1.8 o leitor lia mensagens com várias versões como um produto só e guardou preços vistos errados.
// Recomeça a lista: os registros novos usam outro código, então nunca se confundem com os antigos.
if ((S.settings.seenV || 0) < 2) {
  if (NATIVE) nativeCall('takeSeen');
  S.settings.seenV = 2;
}
if (S.seen.some(r => !String(r.id).startsWith('v2_'))) { S.seen = S.seen.filter(r => String(r.id).startsWith('v2_')); stamp(); }
render();
Cloud.setStatus('local');
Cloud.init();
if (NATIVE) { pullNativeOffers(); nativeSync(); }
Drive.init();
Cloud.setStatus(Cloud.status);

</script>
